[project]
name = "okala-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Okala: find grocery stores that deliver to you, compare prices across stores, browse deals."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sepehr", email = "sepehr@nextofx.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "okala", "iran", "e-commerce", "shopping", "grocery", "supermarket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/sepehr071/okala-mcp"
Source = "https://github.com/sepehr071/okala-mcp"
Changelog = "https://github.com/sepehr071/okala-mcp/releases"
Issues = "https://github.com/sepehr071/okala-mcp/issues"

[project.scripts]
okala-mcp = "okala_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Okala API (run with -m live)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long Field(description=...) strings read better on one line
